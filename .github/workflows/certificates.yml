name: P181 throughput pilot

on:
  workflow_dispatch:
    inputs:
      proof:
        description: Certificate to regenerate and verify
        required: true
        type: choice
        default: 9053-anchor
        options: [8749-exact, 9053-anchor, p181-anchor]
      sector:
        description: Check sector for an anchor run
        required: true
        type: choice
        default: X
        options: [X, Z]
      anchor:
        description: Zero-based anchor number for an anchor run
        required: true
        type: string
        default: "35"

permissions:
  contents: read

jobs:
  pilot:
    name: P181 ${{ matrix.sector }}${{ matrix.anchor }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        sector: [X, Z]
        anchor: [0, 10]
    env:
      LAKE_ARTIFACT_CACHE: 'true'
      MATHLIB_NO_CACHE_ON_UPDATE: '1'
      LEAN_NUM_THREADS: '1'
      SECTOR: ${{ matrix.sector }}
      ANCHOR: ${{ matrix.anchor }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-lean
      - name: Run paired throughput measurements
        run: |
          set -euo pipefail
          lake --fail-fast build +ArmillaryLean
          lake --no-build lean tools/ExportReducedRows.lean
          work=.lake/reduced
          if [[ "$SECTOR" == X ]]; then other=Z; else other=X; fi
          c++ -O3 -std=c++20 tools/search_reduced.cpp -o "$work/search"
          c++ -O3 -std=c++20 tools/replay_reduced.cpp -o "$work/replay"
          "$work/search" "$work/181-$SECTOR.rows" "$work/181-$other.rows" 181 4 14 "$ANCHOR" "$((ANCHOR + 1))" --binary --xor > "$work/pilot.bin"
          "$work/replay" "$work/181-$SECTOR.rows" "$work/181-$other.rows" 181 4 14 "$ANCHOR" "$((ANCHOR + 1))" "$work/pilot.bin"
          python3 -B tools/p181_pilot.py "$SECTOR" "$ANCHOR" "$work/pilot.bin"
