name: Exact 9053 distance

on:
  workflow_dispatch:
    inputs:
      scope:
        description: Verify all X anchors or test the shard transfer with two anchors
        type: choice
        required: true
        default: full
        options: [full, smoke]

permissions:
  contents: read
  actions: read

env:
  LAKE_ARTIFACT_CACHE: "true"
  MATHLIB_NO_CACHE_ON_UPDATE: "1"
  LEAN_NUM_THREADS: "1"

jobs:
  assemble:
    name: Transfer the original verified shards
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-lean
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          github-token: ${{ github.token }}
          run-id: 44336436018
          name: reduced-9053-inputs
          path: .lake/reduced
      - uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: .lake/9053-shards
          key: 9053-kernel-44336436018-0
          fail-on-cache-miss: true
      - uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: .lake/9053-shards
          key: 9053-kernel-44336436018-1
          fail-on-cache-miss: true
      - uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: .lake/9053-shards
          key: 9053-kernel-44336436018-2
          fail-on-cache-miss: true
      - uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: .lake/9053-shards
          key: 9053-kernel-44336436018-3
          fail-on-cache-miss: true
      - uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: .lake/9053-shards
          key: 9053-kernel-44336436018-4
          fail-on-cache-miss: true
      - uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: .lake/9053-shards
          key: 9053-kernel-44336436018-5
          fail-on-cache-miss: true
      - uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: .lake/9053-shards
          key: 9053-kernel-44336436018-6
          fail-on-cache-miss: true
      - uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: .lake/9053-shards
          key: 9053-kernel-44336436018-7
          fail-on-cache-miss: true
      - uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: .lake/9053-shards
          key: 9053-kernel-44336436018-8
          fail-on-cache-miss: true
      - uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: .lake/9053-shards
          key: 9053-kernel-44336436018-9
          fail-on-cache-miss: true
      - uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: .lake/9053-shards
          key: 9053-kernel-44336436018-10
          fail-on-cache-miss: true
      - uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: .lake/9053-shards
          key: 9053-kernel-44336436018-11
          fail-on-cache-miss: true
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: verified-9053-shards
          path: .lake/9053-shards
          include-hidden-files: true
          compression-level: 0
          retention-days: 2
          if-no-files-found: error
